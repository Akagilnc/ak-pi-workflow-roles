name: ci
on:
  push:
    # CI green-light filter for push runs (issue #555). Publish eligibility is
    # enforced downstream by publish-registry.yml via repository.default_branch
    # (issue #798); do not treat this list as a publish allowlist to copy.
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run test:all
        env:
          AK_LEGACY_CASE_A_LIVE_SOURCE: "0"
          GH_TOKEN: ${{ github.token }}
