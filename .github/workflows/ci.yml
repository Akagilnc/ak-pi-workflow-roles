name: ci
on:
  push:
    # Allowlist sole source of truth for publish eligibility (issue #555).
    # Downstream publish-registry must not copy this list.
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run test:all
        env:
          AK_LEGACY_CASE_A_LIVE_SOURCE: "0"
          GH_TOKEN: ${{ github.token }}
