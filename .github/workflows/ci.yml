name: ci
on:
  push:
    # CI green-light filter for push runs (issue #555). Publish eligibility is
    # enforced downstream by publish-registry.yml via repository.default_branch
    # (issue #798); do not treat this list as a publish allowlist to copy.
    branches: [main]
  pull_request:
# Cancel a pull_request run once its PR gets a new tip — a run for a
# superseded head SHA has no value to PR checks and would otherwise idle
# until the platform's ~6h job cap (issue #848). Scope is pull_request only:
#   - the group key falls back to github.run_id for every non-pull_request
#     event, so each push run gets its own group and can never collide with
#     another push run;
#   - cancel-in-progress is gated on event_name == 'pull_request', so even a
#     same-group push run could not be cancelled by another push run.
# default-branch push and the publish-registry.yml workflow_run trigger
# (issue #798 seam) are untouched by this.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run test:all
        env:
          AK_LEGACY_CASE_A_LIVE_SOURCE: "0"
          GH_TOKEN: ${{ github.token }}
