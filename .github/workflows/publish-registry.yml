# Publishes every main merge to the npm registry so `pi update --extensions`
# (unversioned npm source) always pulls the latest build, and the registry
# stays a fresh distribution channel. Auth is npm Trusted Publishing (OIDC):
# no long-lived token — the registry trusts this repository + workflow file
# via the package's Trusted Publisher configuration. The version is stamped
# at publish time as 0.1.<commit-count> — monotonic per merge, no write-back
# commit, no version-line conflicts between parallel PRs.
# Requires npm CLI >= 11.5.1 (Node 24 bundles it).
name: publish-registry

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Stamp version and publish (OIDC)
        run: |
          npm --version
          VERSION="0.1.$(git rev-list --count HEAD)"
          npm version "$VERSION" --no-git-tag-version
          npm publish --access public
          echo "Published @akagilnc/pi-workflow-roles@$VERSION" >> "$GITHUB_STEP_SUMMARY"
