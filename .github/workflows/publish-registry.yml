# Publishes every main merge to the npm registry so `pi update --extensions`
# (unversioned npm source) always pulls the latest build, and the registry
# stays a fresh distribution channel. Auth is npm Trusted Publishing (OIDC):
# no long-lived token — the registry trusts this repository + workflow file
# via the package's Trusted Publisher configuration. The version is stamped
# at publish time as 0.1.<commit-count> on main, or
# 0.1.<commit-count>-<channel>.<shortsha> for branch prereleases — monotonic
# per merge on main, unique per commit on channels, no write-back commit.
# Requires npm CLI >= 11.5.1 (Node 24 bundles it).
name: publish-registry

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      channel:
        description: "npm dist-tag channel (latest on main; e.g. dogfood for branch prereleases)"
        required: false
        default: latest

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Stamp version and publish (OIDC)
        env:
          # Expression → env value only; shell reads $CHANNEL (never expands inputs into source).
          CHANNEL: ${{ github.event.inputs.channel || 'latest' }}
        run: |
          npm --version
          if [ "$GITHUB_REF_NAME" != "main" ] && [ "$CHANNEL" = "latest" ]; then
            echo "refuse: non-main ref must name a non-latest channel" >&2
            exit 1
          fi
          VERSION="0.1.$(git rev-list --count HEAD)"
          if [ "$CHANNEL" != "latest" ]; then
            VERSION="$VERSION-$CHANNEL.$(git rev-parse --short=7 HEAD)"
          fi
          npm version "$VERSION" --no-git-tag-version
          PACKAGE_NAME="$(node -p 'require("./package.json").name')"
          if npm view "$PACKAGE_NAME@$VERSION" version >/dev/null 2>&1; then
            # Same commit re-dispatch (or recovered publish): move dist-tag only.
            npm dist-tag add "$PACKAGE_NAME@$VERSION" "$CHANNEL"
            echo "Dist-tag $CHANNEL → $PACKAGE_NAME@$VERSION (version already on registry)" >> "$GITHUB_STEP_SUMMARY"
          else
            npm publish --access public --tag "$CHANNEL"
            echo "Published $PACKAGE_NAME@$VERSION ($CHANNEL)" >> "$GITHUB_STEP_SUMMARY"
          fi
