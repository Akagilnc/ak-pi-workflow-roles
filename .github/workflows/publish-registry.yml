# Publishes after a successful CI push run so the npm registry stays a fresh
# distribution channel. Auth is npm Trusted Publishing (OIDC): no long-lived
# token — the registry trusts this repository + workflow file via the package's
# Trusted Publisher configuration. The version is stamped at publish time as
# 0.1.<commit-count> on the repository default branch (dist-tag latest) —
# monotonic per merge, no write-back commit. Requires npm CLI >= 11.5.1
# (Node 24 bundles it). Non-default-branch CI completions never publish
# (issue #798; #555 non-main→next path revoked).
#
# Trigger/order seam: only ci workflow_run completion. Eligibility binds
# success + push + head_branch == repository.default_branch (dynamic; no
# branch name list). Checkout pins workflow_run.head_sha. No workflow_dispatch.
name: publish-registry

on:
  workflow_run:
    workflows: [ci]
    types: [completed]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    # pull_request CI completions also fire workflow_run; bind event=push and
    # default branch so only the repository default branch publishes. Failure
    # completions never publish. Branch gate is dynamic (repository.default_branch),
    # not a copied name list (issue #798).
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Default GITHUB_SHA/REF point at the default branch under workflow_run;
          # pin the CI head that actually went green.
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Stamp version and publish (OIDC)
        env:
          # Expression → env value only; shell reads $CHANNEL (never expands into source).
          # Default-branch-only publish → latest (#798; next path revoked).
          CHANNEL: latest
        run: bash scripts/publish-registry-stamp.sh
